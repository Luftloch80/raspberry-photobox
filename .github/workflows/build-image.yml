name: Raspberry-Pi-Image bauen

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "image/**"
      - ".github/workflows/build-image.yml"

permissions:
  contents: write

concurrency:
  group: build-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Speicherplatz auf dem Runner freimachen
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      - uses: actions/checkout@v4

      - name: Photobox-Dateien in die Build-Stage kopieren
        run: |
          dest=image/stage-photobox/00-photobox/files/photobox
          mkdir -p "$dest"
          git archive HEAD | tar -x -C "$dest"
          rm -rf "$dest/image" "$dest/.github"
          ls -la "$dest"

      - name: Image bauen (pi-gen)
        id: build
        uses: usimd/pi-gen-action@v1
        with:
          image-name: photobox
          pi-gen-version: 2026-09-15-raspios-bookworm-arm64
          release: bookworm
          stage-list: stage0 stage1 stage2 ./image/stage-photobox
          hostname: photobox
          username: photobox
          password: ${{ secrets.PI_PASSWORD || 'photobox' }}
          disable-first-boot-user-rename: 1
          enable-ssh: 1
          locale: de_DE.UTF-8
          keyboard-keymap: de
          keyboard-layout: German
          timezone: Europe/Berlin
          wpa-country: DE
          enable-cloud-init: 0
          compression: xz
          compression-level: 6
          verbose-output: true

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: image-${{ github.run_number }}
          name: Photobox-Image ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.build.outputs.image-path }}
          body: |
            Fertiges Raspberry-Pi-Image (Raspberry Pi OS Lite 64-bit, Bookworm) für Pi 3/4/5 und Zero 2 W.

            1. Mit dem **Raspberry Pi Imager** auf eine SD-Karte schreiben
               ("Eigenes Image verwenden", bei der Frage nach Anpassungen **"Nein"** wählen).
            2. Optional: auf der SD-Karte (Laufwerk `bootfs`) die Datei `photobox.txt` anpassen
               (WLAN-Name, WLAN-Passwort, PIN, Druckoptionen).
            3. Pi starten. Nach ca. 1–2 Minuten erscheint das WLAN **Photobox** (Passwort `photobox123`).
            4. Auf dem iPad: `http://10.42.0.1:8080/ca.crt` laden und dem Zertifikat vertrauen,
               danach **https://10.42.0.1** öffnen (PIN `2468`).

            SSH/CUPS-Login: Benutzer `photobox`, Passwort `photobox` (bitte mit `passwd` ändern).
