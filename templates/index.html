<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Photobox">
  <meta name="theme-color" content="#0f0f14">
  <link rel="manifest" href="{{ url_for('manifest') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-180.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=v) }}">
  <title>Photobox</title>
</head>
<body>
  <div class="app">
    <main class="stage" id="stage">
      <video id="video" autoplay playsinline muted></video>
      <div class="camera-hint" id="cameraHint">
        <p id="cameraHintText">Kamera wird gestartet …</p>
        <button class="btn" id="cameraRetry" hidden>Kamera erlauben</button>
      </div>
      <div class="countdown" id="countdown" hidden></div>
      <div class="shot-label" id="shotLabel" hidden></div>

      <button class="guide-btn" id="guideBtn" type="button">Drück Mich!</button>
      <div class="flash" id="flash"></div>

      <!-- versteckt: 3× schnell oben links tippen, dann erscheint das Zahnrad -->
      <div class="settings-corner" id="settingsCorner" aria-hidden="true"></div>
      <button class="icon-btn settings-btn" id="settingsBtn" aria-label="Einstellungen" hidden>
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.47.47 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58ZM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2Z"/></svg>
      </button>

      <button class="shutter" id="shutter" aria-label="Foto aufnehmen" disabled hidden>
        <span></span>
      </button>
    </main>

    <aside class="gallery">
      <div class="thumbs" id="thumbs"></div>
    </aside>
  </div>

  <!-- Großansicht / Drucken -->
  <div class="modal" id="viewer" hidden>
    <div class="viewer">
      <div class="viewer-main">
        <div class="viewer-image" id="viewerImage">
          <img id="viewerImg" alt="">
        </div>
        <div class="viewer-actions">
          <div class="viewer-countdown" id="viewerCountdown" aria-label="Zurück zur Kamera in 30 Sekunden">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <circle class="track" cx="32" cy="32" r="28"/>
              <circle class="ring" id="viewerCountdownRing" cx="32" cy="32" r="28"/>
            </svg>
            <span id="viewerCountdownNum">30</span>
          </div>
          <button class="btn primary big" id="printBtn">
            <svg viewBox="0 0 24 24"><path d="M6 9V3h12v6h1a3 3 0 0 1 3 3v6h-4v3H6v-3H2v-6a3 3 0 0 1 3-3h1Zm2 0h8V5H8v4Zm0 6v4h8v-4H8Z"/></svg>
            <span id="printLabel">Drucken</span>
          </button>
          <button class="btn big" id="retryUploadBtn" hidden>Erneut speichern</button>
          <button class="btn big" id="closeViewer">Zurück zur Kamera</button>
        </div>
      </div>
      <div class="viewer-strip" id="viewerStrip"></div>
    </div>
  </div>

  <!-- Anleitung für Gäste -->
  <div class="modal" id="guide" hidden>
    <div class="panel guide">
      <div class="guide-step">
        <b>Timer wählen</b>
        <div class="segmented" id="guideTimer">
          <button type="button" data-v="3">3 Sekunden</button>
          <button type="button" data-v="5">5 Sekunden</button>
        </div>
      </div>
      <div class="guide-shoot">
        <button class="guide-go" id="guideShutter" type="button">Los geht’s</button>
      </div>
    </div>
  </div>

  <!-- Einstellungen -->
  <div class="modal" id="settings" hidden>
    <div class="panel">
      <h2>Einstellungen</h2>
      <label class="check"><input type="checkbox" id="setMirror"> Bild spiegeln (wie ein Spiegel)</label>
      <label class="check"><input type="checkbox" id="setSound"> Auslösegeräusch (Klick) abspielen</label>
      <label class="check"><input type="checkbox" id="setAutoPrint"> Nach der Aufnahme automatisch drucken</label>
      <div class="key-test-box">
        <strong>Fernauslöser testen</strong>
        <p class="key-test" id="keyTest">Jetzt den Bluetooth-Knopf drücken …</p>
      </div>
      <div class="panel-actions">
        <a class="btn small" href="{{ url_for('status_page') }}">WLAN- &amp; Druckerstatus</a>
        <button class="btn primary" id="closeSettings">Fertig</button>
      </div>
    </div>
  </div>

  <!-- Bildschirmschoner: erscheint nach 2 Minuten ohne Bedienung, wacht bei Bewegung auf -->
  <div class="saver" id="saver" hidden>
    <div class="saver-content">
      <div class="saver-icon">📸</div>
      <h1>Willkommen in Emma’s PhotoBox</h1>
      <h2>Stell dich vor die Kamera!</h2>
      <p>Einfach davorstellen oder antippen.</p>
    </div>
  </div>

  <div class="rotate-hint">
    <svg viewBox="0 0 24 24"><path d="M16.5 2h-9A1.5 1.5 0 0 0 6 3.5v17A1.5 1.5 0 0 0 7.5 22h9a1.5 1.5 0 0 0 1.5-1.5v-17A1.5 1.5 0 0 0 16.5 2ZM16 18H8V4h8v14Z"/></svg>
    <p>Bitte das iPad ins Querformat drehen</p>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="{{ url_for('static', filename='app.js', v=v) }}"></script>
</body>
</html>
