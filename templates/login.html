<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Photobox">
  <link rel="manifest" href="{{ url_for('manifest') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-180.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <title>Photobox – Anmelden</title>
</head>
<body class="login-page">
  <form class="panel login" method="post">
    <h2>📸 Photobox</h2>
    <label>PIN
      <input type="password" name="pin" inputmode="numeric" autocomplete="current-password" autofocus required>
    </label>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <button class="btn primary big" type="submit">Anmelden</button>
  </form>
</body>
</html>
